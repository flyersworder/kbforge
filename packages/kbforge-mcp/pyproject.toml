[project]
name = "kbforge-mcp"
version = "0.2.0"
description = "MCP source connector for kbforge"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Qing", email = "qingye779@gmail.com" }]
license = { text = "MIT" }
keywords = ["kbforge", "mcp", "model-context-protocol", "okf", "open-knowledge-format", "connector", "knowledge-base"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "kbforge>=0.6.0",
    "mcp>=2.0",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/flyersworder/kbforge/tree/main/packages/kbforge-mcp"
Repository = "https://github.com/flyersworder/kbforge"
Issues = "https://github.com/flyersworder/kbforge/issues"
Changelog = "https://github.com/flyersworder/kbforge/blob/main/CHANGELOG.md"

[project.entry-points."kbforge.connectors"]
mcp = "kbforge_mcp.connector:CONNECTOR"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kbforge_mcp"]
