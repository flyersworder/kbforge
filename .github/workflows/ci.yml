name: CI and Publish to PyPI

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      run_publish:
        description: "Set to true to run the publish job"
        required: false
        default: "false"

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - run: uv python install 3.13
      # Not a lint step: `--frozen` fails if uv.lock has drifted from pyproject.
      - run: uv sync --all-extras --dev --frozen
      # Run the hooks themselves instead of re-invoking ruff and ty, so the revs
      # in .pre-commit-config.yaml are the single source of truth for which tool
      # versions run. A version named here too would be a copy Dependabot cannot
      # see, and it would silently drift from the hook on the next bump.
      - run: uvx prek run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --all-extras --dev --frozen
      # All three workspace packages: `--cov=kbforge` alone left kbforge_mcp's
      # ~840 lines and okfquery's ~350 lines measured by nothing.
      - run: uv run pytest --cov=kbforge --cov=kbforge_mcp --cov=okfquery --cov-report=term-missing

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uvx uv-secure uv.lock

  publish:
    needs: [lint, test, security]
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_publish == 'true')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No `enable-cache`, deliberately. setup-uv v10 changed the `auto` default
      # to DISABLE the cache on `release`, `pull_request_target` and
      # `workflow_run` events, because a poisoned cache entry on those triggers
      # runs with the workflow's own privileges. This job is the whole reason
      # that matters here: it holds `id-token: write` and mints the PyPI
      # trusted-publishing token. An explicit `enable-cache: true` opted straight
      # back out of the protection, on the one job where it counts. The cache
      # saved seconds on a job that runs a few times a month.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv python install 3.13
      # `--all-packages`: this is a uv workspace, and a bare `uv build` builds
      # only the root package -- `kbforge-mcp` is a separate distribution and
      # would never be built or uploaded. `--no-sources` keeps `[tool.uv.sources]`
      # out of the built metadata, so kbforge-mcp's dependency on kbforge is
      # published as the PyPI requirement, not a workspace path.
      - run: uv build --all-packages --no-sources
      # The counterpart to `skip-existing` below. That flag stops a duplicate file
      # from failing the job AFTER other files uploaded, but it also makes "nothing
      # needed publishing" and "the version bump was forgotten" the same green job.
      # This asserts the distribution the tag names is actually about to publish
      # something -- built at the tagged version, and not already on PyPI.
      # Skipped on workflow_dispatch, which has no release tag to check.
      # The tag arrives via `env:`, never interpolated into the `run:` text.
      # `${{ }}` substitutes BEFORE the shell sees the line, so a tag containing
      # a quote would close it and run the rest -- on the one job holding
      # `id-token: write` and minting the PyPI publishing token.
      - if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          uv run --no-project python .github/scripts/check_release_target.py
          "$RELEASE_TAG" dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # `--all-packages` puts all THREE distributions in dist/, but
          # kbforge-mcp and kbforge-okfquery each version independently of
          # kbforge: the next kbforge release that does not also bump one of
          # their pyproject.toml files would re-upload an already-published
          # sdist/wheel, PyPI would 400, and the job could fail AFTER
          # kbforge's own files uploaded -- a half-published release.
          # Skipping an existing file is the only safe default once one job
          # publishes more than one distribution.
          skip-existing: true
