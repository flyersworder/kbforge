name: CI and Publish to PyPI

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      run_publish:
        description: "Set to true to run the publish job"
        required: false
        default: "false"

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - run: uv python install 3.13
      # Not a lint step: `--frozen` fails if uv.lock has drifted from pyproject.
      - run: uv sync --all-extras --dev --frozen
      # Run the hooks themselves instead of re-invoking ruff and ty, so the revs
      # in .pre-commit-config.yaml are the single source of truth for which tool
      # versions run. A version named here too would be a copy Dependabot cannot
      # see, and it would silently drift from the hook on the next bump.
      - run: uvx prek run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --all-extras --dev --frozen
      # Both workspace packages: `--cov=kbforge` alone left kbforge_mcp's
      # ~840 lines measured by nothing.
      - run: uv run pytest --cov=kbforge --cov=kbforge_mcp --cov-report=term-missing

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uvx uv-secure uv.lock

  publish:
    needs: [lint, test, security]
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_publish == 'true')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv python install 3.13
      # `--all-packages`: this is a uv workspace, and a bare `uv build` builds
      # only the root package -- `kbforge-mcp` is a separate distribution and
      # would never be built or uploaded. `--no-sources` keeps `[tool.uv.sources]`
      # out of the built metadata, so kbforge-mcp's dependency on kbforge is
      # published as the PyPI requirement, not a workspace path.
      - run: uv build --all-packages --no-sources
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # `--all-packages` puts BOTH distributions in dist/, but
          # kbforge-mcp versions independently of kbforge: the next kbforge
          # release that does not also bump packages/kbforge-mcp/pyproject.toml
          # would re-upload an already-published kbforge_mcp sdist/wheel, PyPI
          # would 400, and the job could fail AFTER kbforge's own files
          # uploaded -- a half-published release. Skipping an existing file is
          # the only safe default once one job publishes two distributions.
          skip-existing: true
