[project]
name = "kbforge"
version = "0.7.0"
description = "Agent-first knowledge bases, forged from your systems of record"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Qing", email = "qingye779@gmail.com" }]
license = { text = "MIT" }
keywords = [
    "okf",
    "open-knowledge-format",
    "knowledge-base",
    "ai-agents",
    "agent-governance",
    "connectors",
    "pluggy",
    "mcp",
    "rag",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Documentation",
]
dependencies = [
    "pluggy>=1.5",
    "pydantic>=2.0",
    "pyyaml>=6",
]

[project.scripts]
kbforge = "kbforge.__main__:main"

[project.urls]
Homepage = "https://github.com/flyersworder/kbforge"
Repository = "https://github.com/flyersworder/kbforge"
Issues = "https://github.com/flyersworder/kbforge/issues"
Documentation = "https://github.com/flyersworder/kbforge/blob/main/docs/architecture.md"
Changelog = "https://github.com/flyersworder/kbforge/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    # Declared explicitly rather than leaned on transitively via `mcp`: the async
    # tests in packages/kbforge-mcp use anyio's pytest plugin, and a test suite
    # that depends on someone else's dependency breaks for confusing reasons.
    "anyio>=4",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.10",
]
llm = [
    "pydantic-ai-slim[openai]>=2.13.0",
]

# `kbforge-mcp` is a workspace sibling, not a dependency of `kbforge` -- it
# depends on kbforge, so declaring it here in either direction as *published*
# metadata would be circular. It cannot live in the `dev` extra: extras are
# published, `[tool.uv.sources]` is not, so the released wheel would carry
# `Requires-Dist: kbforge-mcp; extra == "dev"` pointing at a distribution
# resolvers outside this workspace may not find, breaking `pip install
# kbforge[dev]`. A PEP 735 dependency group is never written into wheel
# metadata, which is exactly the scope this needs: local development only.
[dependency-groups]
dev = ["kbforge-mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kbforge"]

[tool.hatch.build.targets.sdist]
# Agent/editor config and process plans are not part of the distributed library,
# and neither is the workspace sibling: `packages/kbforge-mcp` is its own
# distribution with its own sdist, so shipping its sources inside kbforge's
# would publish the same code twice. `conftest.py` is the test harness (it
# defines --run-live), not library source.
exclude = [
    ".claude",
    "docs/plans",
    "packages",
    "conftest.py",
]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/kbforge-mcp/tests"]

[tool.ruff]
# Both workspace packages are first-party, so their imports group together and
# `kbforge_mcp` is not sorted in with third-party dependencies.
src = ["src", "packages/kbforge-mcp/src"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ty.environment]
python-version = "3.12"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
kbforge = { workspace = true }
kbforge-mcp = { workspace = true }
