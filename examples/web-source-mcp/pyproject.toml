[project]
name = "kbforge-web-source"
version = "0.1.0"
description = "A reference web-source MCP server (search + read) that kbforge-mcp consumes as-is."
requires-python = ">=3.12"
dependencies = ["mcp>=2.0", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kbforge-web-source = "kbforge_web_source.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kbforge_web_source"]
